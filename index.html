<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاكي | قريباً</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --navy: #020617;
            --navy-light: #0f172a;
            --teal: #0d9488;
            --teal-light: #14b8a6;
            --teal-dark: #115e59;
            --gold: #c9a227;
            --gold-light: #fbbf24;
            --glass: rgba(15, 23, 42, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', sans-serif; }

        body {
            background: var(--navy);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية متدرجة ثابتة */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(13,148,136,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(201,162,39,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(13,148,136,0.06) 0%, transparent 50%);
            z-index: 0;
        }

        #canvas-3d {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-card {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            width: 95%;
            padding: 30px 20px;
        }

        /* اللوجو ثلاثي الأبعاد */
        .logo-section {
            position: relative;
            margin-bottom: 20px;
            perspective: 800px;
        }

        .logo-3d-container {
            width: 220px; height: 220px;
            margin: 0 auto;
            position: relative;
            transform-style: preserve-3d;
            animation: float3d 6s ease-in-out infinite;
        }

        @keyframes float3d {
            0%, 100% { transform: rotateY(0deg) rotateX(5deg) translateY(0); }
            25% { transform: rotateY(8deg) rotateX(-3deg) translateY(-8px); }
            50% { transform: rotateY(0deg) rotateX(-5deg) translateY(-12px); }
            75% { transform: rotateY(-8deg) rotateX(3deg) translateY(-5px); }
        }

        /* التوهج خلف اللوجو */
        .logo-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(-30px);
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(13,148,136,0.35) 0%, rgba(201,162,39,0.1) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(25px);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* حلقة مدارية ثلاثية الأبعاد */
        .orbit-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 240px; height: 240px;
            margin: -120px 0 0 -120px;
            border: 2px solid rgba(13,148,136,0.15);
            border-radius: 50%;
            transform: rotateX(70deg) translateZ(0);
            animation: orbitSpin 8s linear infinite;
        }

        .orbit-ring::before {
            content: '';
            position: absolute;
            top: -5px; left: 50%;
            width: 10px; height: 10px;
            margin-left: -5px;
            background: var(--teal-light);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--teal), 0 0 30px rgba(13,148,136,0.3);
        }

        .orbit-ring-2 {
            position: absolute;
            top: 50%; left: 50%;
            width: 200px; height: 200px;
            margin: -100px 0 0 -100px;
            border: 1px solid rgba(201,162,39,0.1);
            border-radius: 50%;
            transform: rotateX(70deg) rotateZ(60deg) translateZ(0);
            animation: orbitSpin 12s linear infinite reverse;
        }

        .orbit-ring-2::before {
            content: '';
            position: absolute;
            top: -4px; left: 50%;
            width: 8px; height: 8px;
            margin-left: -4px;
            background: var(--gold-light);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--gold), 0 0 25px rgba(201,162,39,0.3);
        }

        @keyframes orbitSpin {
            from { transform: rotateX(70deg) rotateZ(0deg); }
            to { transform: rotateX(70deg) rotateZ(360deg); }
        }

        /* اللوجو بخلفية شفافة تماماً */
        .logo-box {
            width: 180px; height: 180px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(20px);
            display: flex; justify-content: center; align-items: center;
            z-index: 2;
        }

        /* الحيلة: طبقتان — الخارجية screen تزيل الأبيض، الداخلية multiply تحافظ على الألوان */
        .logo-blend-outer {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            mix-blend-mode: screen;
            background: #fff;
            border-radius: 50%;
        }

        .logo-blend-outer img {
            width: 100%; height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        /* ظل ثلاثي الأبعاد أسفل اللوجو */
        .logo-shadow {
            position: absolute;
            bottom: -15px; left: 50%;
            transform: translateX(-50%) translateZ(-20px) rotateX(80deg);
            width: 120px; height: 30px;
            background: radial-gradient(ellipse, rgba(13,148,136,0.2) 0%, transparent 70%);
            filter: blur(8px);
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, var(--gold-light) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .tagline {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* المؤقت */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .unit {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px 12px;
            border-radius: 20px;
            min-width: 85px;
            border: 1px solid rgba(13,148,136,0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
        }

        .unit::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--teal), var(--gold));
        }

        .unit:hover {
            transform: translateY(-3px);
            border-color: rgba(13,148,136,0.4);
        }

        .num {
            font-size: 2rem;
            font-weight: 700;
            display: block;
            background: linear-gradient(180deg, var(--teal-light), var(--teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .label { font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block; }

        /* نموذج الاشتراك */
        .form-box { max-width: 480px; margin: 0 auto; }

        .input-group {
            display: flex;
            gap: 10px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(13,148,136,0.15);
            transition: border-color 0.3s;
        }

        .input-group:focus-within {
            border-color: rgba(13,148,136,0.5);
        }

        input {
            background: transparent;
            border: none;
            flex: 1;
            padding: 14px 20px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        input::placeholder { color: #475569; }

        button {
            background: linear-gradient(135deg, var(--teal), var(--teal-dark));
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        button:hover {
            background: linear-gradient(135deg, var(--teal-light), var(--teal));
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(13,148,136,0.4);
        }

        .footer {
            margin-top: 45px;
            font-size: 0.8rem;
            color: #475569;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            .main-card { padding: 20px 15px; }
            .logo-3d-container { width: 170px; height: 170px; }
            .logo-box { width: 140px; height: 140px; }
            .logo-glow { width: 170px; height: 170px; }
            .orbit-ring { width: 180px; height: 180px; margin: -90px 0 0 -90px; }
            .orbit-ring-2 { width: 155px; height: 155px; margin: -77px 0 0 -77px; }
            .countdown { gap: 8px; }
            .unit { min-width: 70px; padding: 14px 8px; }
            .num { font-size: 1.6rem; }
            .input-group { flex-direction: column; background: transparent; border: none; padding: 0; backdrop-filter: none; }
            input { background: var(--glass); border-radius: 14px; margin-bottom: 10px; border: 1px solid rgba(13,148,136,0.15); backdrop-filter: blur(10px); }
            button { padding: 15px; width: 100%; border-radius: 14px; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-3d"></canvas>

    <div class="main-card">
        <div class="logo-section">
            <div class="logo-3d-container" id="logo3d">
                <div class="logo-glow"></div>
                <div class="orbit-ring"></div>
                <div class="orbit-ring-2"></div>
                <div class="logo-box">
                    <div class="logo-blend-outer">
                        <img src="logo.png" alt="المحاكي">
                    </div>
                </div>
                <div class="logo-shadow"></div>
            </div>
        </div>

        <h1>المحاكي</h1>
        <p class="tagline">
            منصة محاكاة الاختبارات الوطنية (القدرات - التحصيلي - نافس)
            <br>
            سجل اهتمامك الآن سواء كنت (طالباً - مدرباً - مدرسة)
        </p>
        <div class="countdown">
            <div class="unit"><span class="num" id="d">00</span><span class="label">أيام</span></div>
            <div class="unit"><span class="num" id="h">00</span><span class="label">ساعات</span></div>
            <div class="unit"><span class="num" id="m">00</span><span class="label">دقائق</span></div>
            <div class="unit"><span class="num" id="s">00</span><span class="label">ثواني</span></div>
        </div>

        <div class="form-box">
            <div class="input-group">
                <input type="email" placeholder="بريدك الإلكتروني للحصول على دعوة.." id="email">
                <button onclick="subscribe()">سجل اهتمامك</button>
            </div>
            <p id="success" style="display:none; color:#10b981; margin-top:15px; font-weight:bold;">✨ تم التسجيل بنجاح!</p>
        </div>

        <div class="footer">ALMOHAKY.COM &copy; 2026 | جميع الحقوق محفوظة</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script>
        function updateTimer() {
            const target = new Date("August 1, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;
            if (diff > 0) {
                document.getElementById("d").innerText = Math.floor(diff/(1000*60*60*24)).toString().padStart(2,'0');
                document.getElementById("h").innerText = Math.floor((diff%(1000*60*60*24))/(1000*60*60)).toString().padStart(2,'0');
                document.getElementById("m").innerText = Math.floor((diff%(1000*60*60))/(1000*60)).toString().padStart(2,'0');
                document.getElementById("s").innerText = Math.floor((diff%(1000*60))/1000).toString().padStart(2,'0');
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        function initBackground() {
            if (typeof THREE === 'undefined') return;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<3000; i++) {
                pos.push(THREE.MathUtils.randFloatSpread(20), THREE.MathUtils.randFloatSpread(20), THREE.MathUtils.randFloatSpread(20));
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const points = new THREE.Points(geo, new THREE.PointsMaterial({color: 0x0d9488, size: 0.03}));
            scene.add(points);
            camera.position.z = 5;

            function anim() {
                requestAnimationFrame(anim);
                points.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            anim();
        }
        
        setTimeout(initBackground, 500);

        // تأثير 3D تفاعلي مع الماوس
        const logo3d = document.getElementById('logo3d');
        document.addEventListener('mousemove', function(e) {
            const rect = logo3d.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = (e.clientX - cx) / window.innerWidth;
            const dy = (e.clientY - cy) / window.innerHeight;
            const tiltX = dy * 20;
            const tiltY = -dx * 20;
            logo3d.style.animation = 'none';
            logo3d.style.transform = 'rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg)';
        });
        document.addEventListener('mouseleave', function() {
            logo3d.style.animation = '';
            logo3d.style.transform = '';
        });

        function subscribe() {
            const email = document.getElementById("email").value;
            if(!email.includes("@")) return alert("يرجى إدخال بريد صحيح");
            
            emailjs.init("iLLWPCnC4IA-OEiA3");
            emailjs.send("service_uh0bqbc", "template_wb9bdwv", { user_email: email })
                .then(() => {
                    document.getElementById("success").style.display = "block";
                    document.getElementById("email").value = "";
                });
        }
    </script>
</body>
</html>
